# Claude en CI · modo interactivo: responde a @claude en issues y pull requests.
# Basado en el ejemplo oficial «Respond to @claude mentions» (code.claude.com/docs/en/github-actions).
# Requiere: la Claude GitHub App instalada en el repo y el secreto CLAUDE_CODE_OAUTH_TOKEN
# (se genera con `claude setup-token`). El token NUNCA va en este archivo.
# Regla del curso: Claude diagnostica; tú corriges y haces merge con el CI en verde.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Permisos mínimos: lee el código y los logs del CI, y comenta en el PR. No escribe código.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Responder a @claude
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--max-turns 5 --disallowedTools "Edit,Write"'
